<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Study Buddy - Collaboration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      /* Light Mode Variables */
      --bg-body: #FAFAFA;
      --bg-card: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #64748B;
      --accent: #2563EB;
      --accent-light: #EFF6FF;
      --success: #10B981;
      --border: #E2E8F0;

      /* Sidebar Variables */
      --sidebar-width-collapsed: 80px;
      --sidebar-width-expanded: 260px;
    }

    body.dark-mode {
      /* Dark Mode Variables */
      --bg-body: #0F172A;
      --bg-card: #1E293B;
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --accent-light: #334155;
      --border: #334155;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Reusing Sidebar CSS (Should be in styles.css but inline for now as per project state) */
    .sidebar {
      width: var(--sidebar-width-collapsed);
      height: 100vh;
      background-color: var(--bg-card);
      border-right: 1px solid var(--border);
      position: fixed;
      left: 0;
      top: 0;
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      z-index: 1000;
      overflow: hidden;
      white-space: nowrap;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sidebar:hover {
      width: var(--sidebar-width-expanded);
      box-shadow: 4px 0 24px rgba(0, 0, 0, 0.1);
      padding: 24px;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 40px;
      text-decoration: none;
      height: 40px;
    }

    .brand i {
      font-size: 1.5rem;
      min-width: 24px;
      text-align: center;
    }

    .brand span {
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .sidebar:hover .brand span {
      opacity: 1;
    }

    .nav-menu {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px;
      color: var(--text-secondary);
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
      transition: all 0.2s ease;
      justify-content: flex-start;
      height: 48px;
    }

    .nav-item:hover,
    .nav-item.active {
      background-color: var(--accent-light);
      color: var(--accent);
    }

    .nav-item i {
      font-size: 1.25rem;
      min-width: 24px;
      text-align: center;
      display: flex;
      justify-content: center;
    }

    .nav-item span {
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .sidebar:hover .nav-item span {
      opacity: 1;
    }

    .sidebar-footer {
      border-top: 1px solid var(--border);
      padding-top: 20px;
      margin-top: auto;
    }

    /* Content Area */
    .content {
      margin-left: var(--sidebar-width-collapsed);
      padding: 40px;
      max-width: 800px;
      width: 100%;
      transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      flex: 1;
    }

    /* Course Details Specifics */
    .course-header {
      margin-bottom: 32px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 24px;
    }

    .course-icon-large {
      font-size: 4rem;
      color: var(--accent);
      background: var(--accent-light);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 16px;
      display: inline-block;
    }

    h1 {
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 1.1rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-top: 32px;
      margin-bottom: 16px;
    }

    .syllabus-list {
      list-style: none;
      padding: 0;
    }

    .syllabus-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 12px 16px;
      margin-bottom: 8px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-primary);
    }

    .syllabus-item i {
      color: var(--success);
    }

    .mentor-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 24px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .mentor-avatar {
      width: 60px;
      height: 60px;
      background: var(--accent-light);
      color: var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    .btn-enroll {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 12px 32px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 24px;
    }

    .btn-enroll:hover {
      background: #1d4ed8;
    }
  </style>
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/mobile-responsive.css">
</head>

<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <a href="index.html" class="brand">
      <i class="fas fa-graduation-cap"></i>
      <span>Study Buddy</span>
    </a>
    <nav class="nav-menu">
      <a href="index.html" class="nav-item"> <i class="fas fa-home"></i> <span>Dashboard</span> </a>
      <a href="courses.html" class="nav-item active"> <i class="fas fa-book"></i> <span>Courses</span> </a>
      <a href="collab.html" class="nav-item"> <i class="fas fa-users"></i> <span>Collaboration</span> </a>
      <a href="celendar.html" class="nav-item"> <i class="fas fa-calendar"></i> <span>Calendar</span> </a>
      <a href="todo.html" class="nav-item"> <i class="fas fa-check-square"></i> <span>Task Board</span> </a>
      <a href="interview.html" class="nav-item"> <i class="fas fa-user-tie"></i> <span>Interview</span> </a>
      <a href="resources.html" class="nav-item"> <i class="fas fa-folder-open"></i> <span>Resources</span> </a>
    </nav>
    <div class="sidebar-footer">
      <nav class="nav-menu">
        <a href="#" class="nav-item" onclick="toggleTheme()"> <i class="fas fa-moon" id="theme-icon"></i>
          <span>Wait/Dark</span> </a>
        <a href="about.html" class="nav-item"> <i class="fas fa-info-circle"></i> <span>About Us</span> </a>
        <a href="#" class="nav-item" id="account-link"> <i class="fas fa-user-circle"></i> <span>Account</span>
        </a>
      </nav>
    </div>
  </aside>

  <!-- Content -->
  <main class="content">
    <!-- Main Content -->
    <div id="collab-content">
      <div class="page-header" style="margin-bottom: 30px;">
        <h2>Collaboration Hub</h2>
        <p>Connect with friends, create study groups, and collaborate together.</p>
      </div>

      <ul class="nav nav-tabs mb-4 justify-content-center" id="collabTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active d-flex flex-column align-items-center" id="friends-tab" data-bs-toggle="tab"
            data-bs-target="#friends" type="button" style="border: none; padding: 10px 20px;">
            <i class="fas fa-user-friends mb-1" style="font-size: 1.5rem;"></i>
            <span style="font-size: 0.85rem; font-weight: 600;">Friends</span>
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link d-flex flex-column align-items-center" id="groups-tab" data-bs-toggle="tab"
            data-bs-target="#groups" type="button" style="border: none; padding: 10px 20px;">
            <i class="fas fa-users mb-1" style="font-size: 1.5rem;"></i>
            <span style="font-size: 0.85rem; font-weight: 600;">Groups</span>
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link d-flex flex-column align-items-center" id="invitations-tab" data-bs-toggle="tab"
            data-bs-target="#invitations" type="button" style="border: none; padding: 10px 20px;">
            <i class="fas fa-envelope mb-1" style="font-size: 1.5rem;"></i>
            <span style="font-size: 0.85rem; font-weight: 600;">Invitations</span>
            <span class="badge bg-danger position-absolute top-0 start-100 translate-middle" id="invitation-count"
              style="display: none; font-size: 0.65rem;">0</span>
          </button>
        </li>
      </ul>

      <!-- Tab Content -->
      <div class="tab-content" id="collabTabContent">
        <!-- Friends Tab -->
        <div class="tab-pane fade show active" id="friends" role="tabpanel">
          <!-- Search Friends -->
          <div class="glass-card" style="padding: 24px; margin-bottom: 24px;">
            <h5 class="mb-3"><i class="fas fa-search me-2"></i>Find Friends</h5>
            <div class="row g-3">
              <div class="col-md-8">
                <input type="email" class="form-control" id="friend-email-search"
                  placeholder="Enter friend's email address">
              </div>
              <div class="col-md-4">
                <button class="btn btn-primary w-100" onclick="searchAndSendRequest()">
                  <i class="fas fa-user-plus me-2"></i>Send Request
                </button>
              </div>
            </div>
            <div id="search-result" class="mt-3"></div>
          </div>

          <!-- Friends List -->
          <div class="glass-card" style="padding: 24px;">
            <h5 class="mb-3"><i class="fas fa-user-friends me-2"></i>My Friends</h5>
            <div id="friends-list" class="row g-3">
              <!-- Friends will be loaded here -->
            </div>
          </div>
        </div>

        <!-- Groups Tab -->
        <div class="tab-pane fade" id="groups" role="tabpanel">
          <!-- Create Group Button -->
          <div class="mb-4">
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createGroupModal">
              <i class="fas fa-plus-circle me-2"></i>Create New Group
            </button>
          </div>

          <!-- My Groups -->
          <div class="glass-card" style="padding: 24px;">
            <h5 class="mb-3"><i class="fas fa-users me-2"></i>My Study Groups</h5>
            <div id="groups-list" class="row g-3">
              <!-- Groups will be loaded here -->
            </div>
          </div>
        </div>

        <!-- Invitations Tab -->
        <div class="tab-pane fade" id="invitations" role="tabpanel">
          <!-- Friend Requests -->
          <div class="glass-card" style="padding: 24px; margin-bottom: 24px;">
            <h5 class="mb-3"><i class="fas fa-user-plus me-2"></i>Friend Requests</h5>
            <div id="friend-requests-list">
              <!-- Friend requests will be loaded here -->
            </div>
          </div>

          <!-- Group Invitations -->
          <div class="glass-card" style="padding: 24px;">
            <h5 class="mb-3"><i class="fas fa-users me-2"></i>Group Invitations</h5>
            <div id="group-invitations-list">
              <!-- Group invitations will be loaded here -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Create Group Modal -->
  <div class="modal fade" id="createGroupModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="fas fa-users me-2"></i>Create Study Group</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Group Name</label>
            <input type="text" class="form-control" id="group-name" placeholder="e.g., CS101 Study Group">
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" id="group-description" rows="3"
              placeholder="What is this group about?"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="handleCreateGroup()">
            <i class="fas fa-check me-2"></i>Create Group
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/theme-manager.js"></script>

  <script>
    // Initialize Firebase (Add your own config)
    const firebaseConfig = {
      apiKey: "AIzaSyD7aQk3I8Z1Q4b2fKqK7q8Z2JkLmNpOqRSt",
      authDomain: "study-buddy-demo.firebaseapp.com",
      projectId: "study-buddy-demo",
      storageBucket: "study-buddy-demo.appspot.com",
      messagingSenderId: "123456789012",
      appId: "1:123456789012:web:abcdef123456"
    };

    // Initialize Firebase if not already initialized
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    // Theme management is now handled by theme-manager.js

    // In-memory database for demo
    const demoDatabase = {
      users: [
        { id: '1', email: 'alex@example.com', displayName: 'Alex Johnson', status: 'Online' },
        { id: '2', email: 'sam@example.com', displayName: 'Sam Wilson', status: 'Offline' },
        { id: '3', email: 'taylor@example.com', displayName: 'Taylor Swift', status: 'Online' },
        { id: '4', email: 'chris@example.com', displayName: 'Chris Evans', status: 'Online' },
        { id: '5', email: 'test@example.com', displayName: 'Test User', status: 'Online' }
      ],
      friends: [
        { id: '1', userId: 'current', friendId: '1', status: 'accepted' },
        { id: '2', userId: 'current', friendId: '2', status: 'accepted' }
      ],
      friendRequests: [
        {
          id: '1',
          from: '4',
          fromName: 'Chris Evans',
          to: 'current',
          timestamp: new Date('2024-03-10'),
          status: 'pending'
        }
      ],
      groups: [
        {
          id: '1',
          name: 'CS101 Study Group',
          description: 'Introduction to Computer Science',
          members: ['current', '1', '2'],
          createdAt: new Date('2024-01-15')
        },
        {
          id: '2',
          name: 'Math Study Group',
          description: 'Calculus and Linear Algebra',
          members: ['current', '3'],
          createdAt: new Date('2024-02-01')
        }
      ]
    };

    // Current user (for demo)
    const currentUser = {
      id: 'current',
      email: 'me@example.com',
      displayName: 'Current User'
    };

    // Mobile Sidebar Toggle
    document.addEventListener('DOMContentLoaded', function () {
      const mobileMenuBtn = document.getElementById('mobileMenuBtn');
      const sidebar = document.getElementById('sidebar');
      const sidebarOverlay = document.getElementById('sidebarOverlay');

      // Toggle sidebar on mobile
      function toggleSidebar() {
        sidebar.classList.toggle('active');
        sidebarOverlay.classList.toggle('active');

        // Change icon based on state
        const icon = mobileMenuBtn.querySelector('i');
        if (sidebar.classList.contains('active')) {
          icon.classList.remove('fa-bars');
          icon.classList.add('fa-times');
        } else {
          icon.classList.remove('fa-times');
          icon.classList.add('fa-bars');
        }
      }

      // Event Listeners
      if (mobileMenuBtn) {
        mobileMenuBtn.addEventListener('click', toggleSidebar);
      }

      if (sidebarOverlay) {
        sidebarOverlay.addEventListener('click', toggleSidebar);
      }

      // Close sidebar when clicking on a nav link (on mobile)
      const navLinks = document.querySelectorAll('.nav-item');
      navLinks.forEach(link => {
        link.addEventListener('click', function () {
          if (window.innerWidth <= 768) {
            toggleSidebar();
          }
        });
      });

      // Initialize sample data
      initializeSampleData();
    });

    // Initialize and display data
    function initializeSampleData() {
      // Get current user's friends
      const myFriends = demoDatabase.friends
        .filter(f => f.userId === 'current' && f.status === 'accepted')
        .map(f => {
          const friend = demoDatabase.users.find(u => u.id === f.friendId);
          return friend;
        });

      // Get current user's groups
      const myGroups = demoDatabase.groups
        .filter(g => g.members.includes('current'))
        .map(g => ({
          ...g,
          members: g.members.length
        }));

      // Get friend requests sent to current user
      const myFriendRequests = demoDatabase.friendRequests
        .filter(r => r.to === 'current' && r.status === 'pending');

      // Display data
      displayFriends(myFriends);
      displayGroups(myGroups);
      displayFriendRequests(myFriendRequests);

      // Show invitation count
      const totalInvitations = myFriendRequests.length;
      if (totalInvitations > 0) {
        document.getElementById('invitation-count').style.display = 'inline-block';
        document.getElementById('invitation-count').textContent = totalInvitations;
      }
    }

    // Search and send friend request
    async function searchAndSendRequest() {
      const email = document.getElementById('friend-email-search').value.trim().toLowerCase();
      const resultDiv = document.getElementById('search-result');

      if (!email) {
        showAlert(resultDiv, 'Please enter an email address', 'warning');
        return;
      }

      // Validate email format
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        showAlert(resultDiv, 'Please enter a valid email address', 'warning');
        return;
      }

      // Check if email is the current user's email
      if (email === currentUser.email) {
        showAlert(resultDiv, 'You cannot send a friend request to yourself', 'warning');
        return;
      }

      // Show loading
      showAlert(resultDiv, 'Searching for user...', 'info');

      // Simulate API call delay
      setTimeout(() => {
        // Find user by email
        const user = demoDatabase.users.find(u => u.email.toLowerCase() === email);

        if (!user) {
          showAlert(resultDiv, `User with email ${email} not found`, 'danger');
          return;
        }

        // Check if already friends
        const alreadyFriends = demoDatabase.friends.some(f =>
          f.userId === 'current' && f.friendId === user.id && f.status === 'accepted'
        );

        if (alreadyFriends) {
          showAlert(resultDiv, `You are already friends with ${user.displayName}`, 'info');
          return;
        }

        // Check if request already sent
        const requestExists = demoDatabase.friendRequests.some(r =>
          (r.from === 'current' && r.to === user.id && r.status === 'pending') ||
          (r.from === user.id && r.to === 'current' && r.status === 'pending')
        );

        if (requestExists) {
          showAlert(resultDiv, `Friend request already sent to ${user.displayName}`, 'info');
          return;
        }

        // Create friend request
        const newRequest = {
          id: Date.now().toString(),
          from: 'current',
          fromName: currentUser.displayName,
          to: user.id,
          toEmail: user.email,
          timestamp: new Date(),
          status: 'pending'
        };

        // Add to database
        demoDatabase.friendRequests.push(newRequest);

        // Show success message with more details
        showAlert(resultDiv,
          `✅ Friend request sent to ${user.displayName} (${user.email})! 
          <br><small>They will see your request in their invitations tab.</small>`,
          'success');

        // Clear input
        document.getElementById('friend-email-search').value = '';

        // Optional: Log the request for debugging
        console.log('Friend request sent:', newRequest);
        console.log('All friend requests:', demoDatabase.friendRequests);

      }, 1000);
    }

    // Display functions
    function displayFriends(friends) {
      const container = document.getElementById('friends-list');

      if (!friends || friends.length === 0) {
        container.innerHTML = `
          <div class="col-12 text-center text-muted">
            <i class="fas fa-users" style="font-size: 3rem; opacity: 0.3;"></i>
            <p class="mt-2">No friends yet. Search and add friends above!</p>
          </div>
        `;
      } else {
        container.innerHTML = friends.map(friend => `
          <div class="col-md-6 col-lg-4">
            <div class="card glass-card hover-3d">
              <div class="card-body text-center">
                <i class="fas fa-user-circle" style="font-size: 3rem; color: var(--accent);"></i>
                <h6 class="mt-2 mb-1">${friend.displayName}</h6>
                <small class="text-muted">${friend.email}</small>
                <div class="mt-2">
                  <span class="badge ${friend.status === 'Online' ? 'bg-success' : 'bg-secondary'}">
                    ${friend.status}
                  </span>
                </div>
                <div class="mt-3">
                  <button class="btn btn-sm btn-outline-primary me-2" onclick="messageFriend('${friend.id}')">
                    <i class="fas fa-comment"></i> Message
                  </button>
                  <button class="btn btn-sm btn-outline-danger" onclick="removeFriend('${friend.id}')">
                    <i class="fas fa-user-minus"></i> Remove
                  </button>
                </div>
              </div>
            </div>
          </div>
        `).join('');
      }
    }

    function displayGroups(groups) {
      const container = document.getElementById('groups-list');

      if (!groups || groups.length === 0) {
        container.innerHTML = `
          <div class="col-12 text-center text-muted">
            <i class="fas fa-users-cog" style="font-size: 3rem; opacity: 0.3;"></i>
            <p class="mt-2">No groups yet. Create your first study group!</p>
          </div>
        `;
      } else {
        container.innerHTML = groups.map(group => `
          <div class="col-md-6 col-lg-4">
            <div class="card glass-card hover-3d">
              <div class="card-body">
                <h6 class="mb-2"><i class="fas fa-users me-2"></i>${group.name}</h6>
                <p class="text-muted small mb-2">${group.description}</p>
                <div class="d-flex justify-content-between align-items-center">
                  <small><i class="fas fa-user me-1"></i>${group.members} members</small>
                  <small class="text-muted">${group.createdAt.toLocaleDateString()}</small>
                </div>
                <div class="mt-3">
                  <button class="btn btn-sm btn-outline-primary w-100" onclick="viewGroup('${group.id}')">
                    <i class="fas fa-door-open me-1"></i> Enter Group
                  </button>
                </div>
              </div>
            </div>
          </div>
        `).join('');
      }
    }

    function displayFriendRequests(requests) {
      const container = document.getElementById('friend-requests-list');

      if (!requests || requests.length === 0) {
        container.innerHTML = `
          <div class="text-center text-muted">
            <i class="fas fa-inbox" style="font-size: 3rem; opacity: 0.3;"></i>
            <p class="mt-2">No pending friend requests</p>
          </div>
        `;
      } else {
        container.innerHTML = requests.map(req => `
          <div class="card mb-2 glass-card">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center">
                <div>
                  <h6 class="mb-1">${req.fromName}</h6>
                  <small class="text-muted">Sent ${req.timestamp.toLocaleDateString()}</small>
                </div>
                <div>
                  <button class="btn btn-sm btn-success me-2" onclick="acceptRequest('${req.id}')">
                    <i class="fas fa-check"></i> Accept
                  </button>
                  <button class="btn btn-sm btn-danger" onclick="rejectRequest('${req.id}')">
                    <i class="fas fa-times"></i> Reject
                  </button>
                </div>
              </div>
            </div>
          </div>
        `).join('');
      }
    }

    // Create group
    async function handleCreateGroup() {
      const name = document.getElementById('group-name').value.trim();
      const description = document.getElementById('group-description').value.trim();

      if (!name) {
        alert('Please enter a group name');
        return;
      }

      // Create new group
      const newGroup = {
        id: Date.now().toString(),
        name: name,
        description: description,
        members: ['current'],
        createdAt: new Date()
      };

      // Add to database
      demoDatabase.groups.push(newGroup);

      // Close modal
      const modal = bootstrap.Modal.getInstance(document.getElementById('createGroupModal'));
      modal.hide();

      // Clear form
      document.getElementById('group-name').value = '';
      document.getElementById('group-description').value = '';

      // Show success message
      showAlert(document.getElementById('search-result'),
        `✅ Group "${name}" created successfully!`, 'success');

      // Reload groups
      initializeSampleData();
    }

    // Utility functions
    function showAlert(container, message, type = 'info') {
      const alertClass = `alert-${type}`;
      container.innerHTML = `
        <div class="alert ${alertClass}">
          <i class="fas fa-${getIconForType(type)} me-2"></i>
          ${message}
        </div>
      `;
    }

    function getIconForType(type) {
      switch (type) {
        case 'success': return 'check-circle';
        case 'warning': return 'exclamation-triangle';
        case 'danger': return 'times-circle';
        case 'info': return 'info-circle';
        default: return 'info-circle';
      }
    }

    function acceptRequest(requestId) {
      const request = demoDatabase.friendRequests.find(r => r.id === requestId);
      if (!request) return;

      // Update request status
      request.status = 'accepted';

      // Add friendship to database
      demoDatabase.friends.push({
        id: Date.now().toString(),
        userId: 'current',
        friendId: request.from,
        status: 'accepted'
      });

      // Show notification
      showAlert(document.getElementById('search-result'),
        `✅ You are now friends with ${request.fromName}!`, 'success');

      // Remove from UI
      document.querySelector(`button[onclick="acceptRequest('${requestId}')]`).closest('.card').remove();

      // Update invitation count
      updateInvitationCount();

      // Reload friends list
      initializeSampleData();
    }

    function rejectRequest(requestId) {
      const request = demoDatabase.friendRequests.find(r => r.id === requestId);
      if (!request) return;

      // Update request status
      request.status = 'rejected';

      // Remove from UI
      document.querySelector(`button[onclick="rejectRequest('${requestId}')]`).closest('.card').remove();

      // Update invitation count
      updateInvitationCount();

      showAlert(document.getElementById('search-result'),
        `Friend request from ${request.fromName} rejected`, 'info');
    }

    function updateInvitationCount() {
      const pendingRequests = demoDatabase.friendRequests.filter(r =>
        r.to === 'current' && r.status === 'pending'
      );

      const badge = document.getElementById('invitation-count');
      if (pendingRequests.length > 0) {
        badge.style.display = 'inline-block';
        badge.textContent = pendingRequests.length;
      } else {
        badge.style.display = 'none';
      }
    }

    function viewGroup(groupId) {
      const group = demoDatabase.groups.find(g => g.id === groupId);
      if (group) {
        alert(`Entering group: ${group.name}\n\nDescription: ${group.description}\nMembers: ${group.members.length}`);
      }
    }

    function messageFriend(friendId) {
      const friend = demoDatabase.users.find(u => u.id === friendId);
      if (friend) {
        alert(`Opening chat with ${friend.displayName}...\n\nFeature coming soon!`);
      }
    }

    function removeFriend(friendId) {
      if (confirm('Are you sure you want to remove this friend?')) {
        // Remove friendship from database
        demoDatabase.friends = demoDatabase.friends.filter(f =>
          !(f.userId === 'current' && f.friendId === friendId)
        );

        // Reload friends list
        initializeSampleData();

        showAlert(document.getElementById('search-result'),
          'Friend removed successfully', 'info');
      }
    }
  </script>
</body>

</html>
